[project]
name = "hyromy-api"
version = "0.1.0"
description = "REST API by Hyromy"
authors = [
    {name = "Hyromy",email = "formulajoel9@gmail.com"}
]
license = {text = "MIT License"}
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1,<7.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "gevent (>=26.8.0,<27.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.4,<0.17.0)"
]
testing = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)"
]
