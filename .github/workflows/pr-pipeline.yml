name: PR Pipeline

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch for main
        run: |
          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Only PRs from 'dev' branch are allowed into 'main'."
            exit 1
          fi

  quality-gate:
    needs: check-branch
    uses: ./.github/workflows/quality-gate.yml
