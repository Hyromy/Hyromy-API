services:
  api:
    build: .
    container_name: api-app
    ports:
      - 4000:4000

    environment:
      - DEBUG=False
      - DJANGO_SECRET_KEY=this-is-not-secure-but-it-is-for-demo-purposes-only-so-be-careful

      - USE_SSL=False

      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_HOST=db
      - DB_PORT=5432

    networks:
      - net

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: db
    ports:
      - 5432:5432

    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  net:
    driver: bridge
